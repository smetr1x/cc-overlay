# Loki для событий Claude Code (ADR-0005). Один процесс, хранение на локальном диске.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Срок хранения как у метрик: 30 дней. Удаляет compactor.
  retention_period: 720h
  # Атрибуты событий OTLP хранятся как structured metadata, а не как метки потока:
  # session_id и prompt_id уникальны, метки с ними разорвали бы индекс на тысячи потоков.
  allow_structured_metadata: true
  reject_old_samples: true
  reject_old_samples_max_age: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 16

# Без отправки статистики использования в Grafana Labs.
analytics:
  reporting_enabled: false
