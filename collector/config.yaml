# Конфигурация OpenTelemetry Collector для cc-overlay.
# Обоснования: docs/adr/0001 (temporality), 0002 (путь метрик), 0008 (приватность).

receivers:
  # Основной вход. Claude Code шлёт сюда cumulative-метрики.
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

  # Запасной вход для delta-метрик (ADR-0001). Порт наружу не публикуется;
  # путь существует, чтобы e2e-тесты держали его рабочим.
  otlp/delta:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4319

processors:
  # Всегда первый: отказывает во входе раньше, чем данные займут память дальше по конвейеру.
  memory_limiter:
    check_interval: 1s
    limit_mib: 110
    spike_limit_mib: 25

  # Идентификаторы пользователя лежат в атрибутах точек, а не в resource,
  # поэтому удаляются в контексте datapoint. session.id остаётся: на нём построены показатели.
  transform/drop_ids:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - delete_key(datapoint.attributes, "user.email")
          - delete_key(datapoint.attributes, "user.account_uuid")
          - delete_key(datapoint.attributes, "user.account_id")
          - delete_key(datapoint.attributes, "user.id")
          - delete_key(datapoint.attributes, "organization.id")
    # События нигде не хранятся: из них получается одна метрика (см. connectors).
    # Удаление здесь — второй слой защиты и задел под хранение событий в фазе 4.
    log_statements:
      - context: log
        statements:
          - delete_key(log.attributes, "user.email")
          - delete_key(log.attributes, "user.account_uuid")
          - delete_key(log.attributes, "user.account_id")
          - delete_key(log.attributes, "user.id")
          - delete_key(log.attributes, "organization.id")
          # Содержимое, которое появилось бы, если по ошибке включить OTEL_LOG_USER_PROMPTS и т. п.
          - delete_key(log.attributes, "prompt")
          - delete_key(log.attributes, "prompt_text")
          - delete_key(log.attributes, "tool_parameters")
          - delete_key(log.attributes, "tool_input")

  # Только в запасном конвейере. Состояние хранится в памяти:
  # рестарт коллектора или простой дольше max_stale обнуляют счётчик.
  delta_to_cumulative:
    max_stale: 1h

  batch:
    timeout: 200ms

connectors:
  # Заполнение контекста (ADR-0011). Событие api_request основного диалога превращается
  # в метрику claude_code.context.tokens: сколько токенов было на входе последнего запроса.
  # Это и есть занятая часть окна контекста; та же формула у поля used_percentage в status line.
  # Так показатель доступен в сессиях расширения VS Code и не требует хранилища событий.
  signal_to_metrics:
    logs:
      - name: claude_code.context.tokens
        description: Input tokens of the latest main-conversation API request (context window usage).
        include_resource_attributes:
          - key: service.name
        attributes:
          - key: session.id
        # Основной диалог помечен query_source "main" в терминале и "sdk" в расширении VS Code
        # (расширение запускает Claude Code через SDK). Значение "sdk" в документации не описано,
        # найдено на настоящих событиях. Субагенты и вспомогательные запросы сюда не входят:
        # у них свой контекст.
        conditions:
          - >-
            log.attributes["event.name"] == "api_request"
            and (log.attributes["query_source"] == "main" or log.attributes["query_source"] == "sdk")
        gauge:
          # У настоящего Claude Code это целые числа; Double() на случай, если тип изменится.
          value: >-
            Double(log.attributes["input_tokens"])
            + Double(log.attributes["cache_read_tokens"])
            + Double(log.attributes["cache_creation_tokens"])

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Время точки от источника, а не время scrape: на нём построен показатель свежести.
    send_timestamps: true
    # Сколько экспортёр продолжает отдавать серию без новых точек.
    # Держим заметно меньше часа: Prometheus отвергает точки старше ~1 ч как out-of-bounds.
    metric_expiration: 15m
    # Явно, чтобы имена метрик не зависели от смены значения по умолчанию.
    translation_strategy: UnderscoreEscapingWithSuffixes

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp, signal_to_metrics]
      processors: [memory_limiter, transform/drop_ids, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/drop_ids]
      exporters: [signal_to_metrics]
    metrics/delta:
      receivers: [otlp/delta]
      processors: [memory_limiter, transform/drop_ids, delta_to_cumulative, batch]
      exporters: [prometheus]
