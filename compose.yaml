# Стек cc-overlay. Все порты публикуются только на 127.0.0.1.
# Версии образов закреплены; обновление — отдельным коммитом после `make check test-e2e`.
name: cc-overlay

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      # Мягкий предел кучи Go ниже mem_limit: сборщик мусора начинает работать раньше,
      # чем ядро убьёт контейнер.
      GOMEMLIMIT: 120MiB
    volumes:
      - ./collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC: сюда пишет Claude Code
      - "127.0.0.1:13133:13133" # health_check
    mem_limit: 160m
    restart: unless-stopped
    # В образе нет shell, поэтому healthcheck средствами compose невозможен.
    # Готовность проверяет `make wait` через порт 13133, а в работе — Prometheus (метрика up).

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 160m
    restart: unless-stopped
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  overlay-api:
    build: ./overlay-api
    image: cc-overlay/overlay-api:dev
    environment:
      OVERLAY_PROMETHEUS_URL: http://prometheus:9090
      # Часовой пояс для границы «сегодня».
      TZ: ${CC_OVERLAY_TZ:-UTC}
    volumes:
      - ./overlay-api/config.yaml:/etc/overlay-api/config.yaml:ro
    ports:
      - "127.0.0.1:8787:8787" # снимок и поток для оверлея, приём status line
    mem_limit: 32m
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      # В образе нет shell и curl: бинарник проверяет себя сам.
      test: ["CMD", "/overlay-api", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 6

  # Node-окружение фронтенда оверлея: тесты, сборка и просмотр в браузере (make overlay-dev).
  # Само окно оверлея собирается на Windows; здесь проверяется всё, что от окна не зависит.
  overlay-dev:
    image: node:24.22.3-alpine3.24
    profiles: ["dev"]
    working_dir: /app
    environment:
      OVERLAY_DEV_HOST: 0.0.0.0
      OVERLAY_DEV_POLL: "1"
      OVERLAY_API_PROXY: http://overlay-api:8787
    volumes:
      - ./overlay:/app
      # Отдельный том: зависимости для Linux не должны смешиваться с node_modules,
      # которые на том же диске создаёт npm под Windows.
      - overlay-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:1420:1420"
    command: ["sh", "-c", "npm ci && npm run dev"]

  grafana:
    image: grafana/grafana:13.2.6
    profiles: ["history"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?задай GRAFANA_ADMIN_PASSWORD в .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    # Grafana 13 занимает около 190 МБ уже в простое, без дашбордов.
    mem_limit: 350m
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12

# Подсеть задана явно. Автовыбор Docker отказывает («all predefined address pools have been
# fully subnetted»), когда VPN держит маршруты на всё адресное пространство; явная подсеть
# эту проверку обходит. При конфликте адресов поменяй CC_OVERLAY_SUBNET в .env.
networks:
  default:
    ipam:
      config:
        - subnet: ${CC_OVERLAY_SUBNET:-10.210.0.0/24}

volumes:
  overlay-node-modules:
  prometheus-data:
  grafana-data:
