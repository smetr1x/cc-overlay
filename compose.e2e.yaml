# Надстройка для тестов. Запускается отдельным проектом (`-p cc-overlay-e2e`),
# поэтому у неё свои тома и сеть: синтетика не попадает в рабочий Prometheus.
# Порты наружу не публикуются, чтобы тесты шли параллельно с рабочим стеком.
services:
  otel-collector:
    ports: !reset []

  prometheus:
    ports: !reset []

  overlay-api:
    ports: !reset []
    environment:
      # Тест снимка шлёт синтетику под отдельным service.name, чтобы не пересекаться с другими тестами.
      OVERLAY_JOB_REGEX: claude-code-snapshot-test
      # Синтетика экспортирует раз в секунду; итоги пересчитываются на каждом опросе.
      OVERLAY_EXPORT_INTERVAL: 1s
      OVERLAY_TOTALS_INTERVAL: 1s

  # Go-окружение для обоих модулей (overlay-api и tools/synth): unit-тесты, e2e и `go mod tidy`. Локально Go не нужен (ADR-0003).
  go:
    image: golang:1.27.4-alpine3.24
    profiles: ["test"]
    working_dir: /repo
    volumes:
      - .:/repo
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    environment:
      CGO_ENABLED: "0"
      SYNTH_OTLP_ENDPOINT: otel-collector:4317
      SYNTH_OTLP_DELTA_ENDPOINT: otel-collector:4319
      PROM_URL: http://prometheus:9090
      OVERLAY_API_URL: http://overlay-api:8787

volumes:
  # Кэши Go внешние, чтобы `down -v` тестового проекта их не удалял.
  gomod:
    external: true
    name: cc-overlay-gomod
  gobuild:
    external: true
    name: cc-overlay-gobuild
